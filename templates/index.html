<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans antialiased">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">User Management System</h1>
            <p class="text-gray-600 mt-2">Manage your users efficiently</p>
        </div>

        <!-- Message Alert -->
        <div id="message" class="hidden mb-6 p-4 rounded-lg"></div>

        <!-- Create User Card -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-8">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-gray-900">
                    <i class="fas fa-user-plus text-primary-600 mr-2"></i>
                    Create New User
                </h2>
            </div>
            <div class="p-6">
                <form id="createUserForm">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-user text-primary-500 mr-1"></i>
                                Name
                            </label>
                            <input type="text" id="name" name="name" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                                placeholder="Enter user name">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-envelope text-primary-500 mr-1"></i>
                                Email
                            </label>
                            <input type="email" id="email" name="email" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                                placeholder="Enter email address">
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit"
                            class="inline-flex items-center px-4 py-2 bg-primary-600 text-white rounded-md hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors">
                            <i class="fas fa-save mr-2"></i>
                            Create User
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Users List Card -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-xl font-semibold text-gray-900">
                    <i class="fas fa-users text-primary-600 mr-2"></i>
                    Users List
                </h2>
            </div>
            <div class="p-6">
                <div id="usersList">
                    <div class="text-center py-8">
                        <i class="fas fa-spinner fa-spin text-primary-500 text-2xl"></i>
                        <p class="text-gray-500 mt-2">Loading users...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-full max-w-md shadow-lg rounded-lg bg-white">
            <div class="mb-4">
                <h3 class="text-lg font-semibold text-gray-900">
                    <i class="fas fa-edit text-primary-600 mr-2"></i>
                    Edit User
                </h3>
            </div>
            <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <div class="mb-4">
                    <label for="editName" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user text-primary-500 mr-1"></i>
                        Name
                    </label>
                    <input type="text" id="editName" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div class="mb-4">
                    <label for="editEmail" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-envelope text-primary-500 mr-1"></i>
                        Email
                    </label>
                    <input type="email" id="editEmail" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()"
                        class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors">
                        <i class="fas fa-times mr-1"></i>
                        Cancel
                    </button>
                    <button type="submit"
                        class="px-4 py-2 bg-primary-600 text-white rounded-md hover:bg-primary-700 transition-colors">
                        <i class="fas fa-save mr-1"></i>
                        Update
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Load users on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadUsers();
        });

        // Create user form submission
        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            
            try {
                const response = await fetch('/users/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email })
                });
                
                if (response.ok) {
                    showMessage('User created successfully!', 'success');
                    document.getElementById('createUserForm').reset();
                    loadUsers();
                } else {
                    const error = await response.json();
                    showMessage(`Error: ${error.detail || 'Failed to create user'}`, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage(`Error: ${error.message} - Make sure the server is running`, 'error');
            }
        });

        // Edit user form submission
        document.getElementById('editUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userId = document.getElementById('editUserId').value;
            const name = document.getElementById('editName').value;
            const email = document.getElementById('editEmail').value;
            
            try {
                const response = await fetch(`/user/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email })
                });
                
                if (response.ok) {
                    showMessage('User updated successfully!', 'success');
                    closeModal();
                    loadUsers();
                } else {
                    const error = await response.json();
                    showMessage(`Error: ${error.detail || 'Failed to update user'}`, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage(`Error: ${error.message}`, 'error');
            }
        });

        async function loadUsers() {
            const usersListDiv = document.getElementById('usersList');
            usersListDiv.innerHTML = `
                <div class="text-center py-8">
                    <i class="fas fa-spinner fa-spin text-primary-500 text-2xl"></i>
                    <p class="text-gray-500 mt-2">Loading users...</p>
                </div>
            `;
            
            try {
                const response = await fetch('/users/');
                
                if (response.ok) {
                    const users = await response.json();
                    displayUsers(users);
                } else {
                    usersListDiv.innerHTML = '<div class="text-center py-8 text-red-500">Failed to load users</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                usersListDiv.innerHTML = '<div class="text-center py-8 text-red-500">Error connecting to server. Please check if the server is running.</div>';
                showMessage('Cannot connect to server. Please check if the server is running.', 'error');
            }
        }

        function displayUsers(users) {
            const usersListDiv = document.getElementById('usersList');
            
            if (!users || users.length === 0) {
                usersListDiv.innerHTML = `
                    <div class="text-center py-8">
                        <i class="fas fa-user-slash text-gray-400 text-4xl mb-2"></i>
                        <p class="text-gray-500">No users found. Create your first user!</p>
                    </div>
                `;
                return;
            }
            
            const tableHtml = `
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    <i class="fas fa-user mr-1"></i> Name
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    <i class="fas fa-envelope mr-1"></i> Email
                                </th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    <i class="fas fa-cog mr-1"></i> Actions
                                </th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="usersTableBody">
                        </tbody>
                    </table>
                </div>
            `;
            
            usersListDiv.innerHTML = tableHtml;
            const tbody = document.getElementById('usersTableBody');
            
            users.forEach(user => {
                const row = tbody.insertRow();
                row.className = 'hover:bg-gray-50 transition-colors';
                
                row.insertCell(0).innerHTML = `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${user.id}</td>`;
                row.insertCell(1).innerHTML = `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${escapeHtml(user.name)}</td>`;
                row.insertCell(2).innerHTML = `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${escapeHtml(user.email)}</td>`;
                
                const actionsCell = row.insertCell(3);
                actionsCell.className = 'px-6 py-4 whitespace-nowrap text-sm font-medium';
                actionsCell.innerHTML = `
                    <button onclick='openEditModal(${JSON.stringify(user)})' 
                        class="text-primary-600 hover:text-primary-900 mr-3 transition-colors">
                        <i class="fas fa-edit"></i> Edit
                    </button>
                    <button onclick='deleteUser(${user.id})' 
                        class="text-red-600 hover:text-red-900 transition-colors">
                        <i class="fas fa-trash-alt"></i> Delete
                    </button>
                `;
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openEditModal(user) {
            document.getElementById('editUserId').value = user.id;
            document.getElementById('editName').value = user.name;
            document.getElementById('editEmail').value = user.email;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function deleteUser(userId) {
            if (confirm('Are you sure you want to delete this user?')) {
                try {
                    const response = await fetch(`/users/${userId}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        showMessage('User deleted successfully!', 'success');
                        loadUsers();
                    } else {
                        const error = await response.json();
                        showMessage(`Error: ${error.detail || 'Failed to delete user'}`, 'error');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showMessage(`Error: ${error.message}`, 'error');
                }
            }
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2"></i>
                ${message}
            `;
            messageDiv.className = `mb-6 p-4 rounded-lg ${type === 'success' ? 'bg-green-50 text-green-800 border border-green-200' : 'bg-red-50 text-red-800 border border-red-200'}`;
            messageDiv.classList.remove('hidden');
            
            setTimeout(() => {
                messageDiv.classList.add('hidden');
            }, 3000);
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
